[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "the-operator"
version = "1.16.0"
description = "Your operator inside the Matrix — a personal Claude assistant in your Matrix chat"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "TheOperatorAgent"},
]
requires-python = ">=3.11"
keywords = ["matrix", "claude", "assistant", "chatbot", "ai"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]

dependencies = [
    "requests>=2.31",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "cryptography>=41.0",
]

[project.optional-dependencies]
m365 = [
    "msal>=1.28",
]
mcp = [
    "mcp>=1.0",
]
all = [
    "the-operator[m365,mcp]",
    "openai>=1.12",
    "playwright>=1.40",
    "presidio-analyzer>=2.2",
    "pypdf>=4.0",
    "fido2>=1.1",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "faker>=22.0",
]

[tool.pytest.ini_options]
testpaths = ["dashboard"]
python_files = ["test_*.py"]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E402", "E501"]

[tool.ruff.format]
quote-style = "double"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
